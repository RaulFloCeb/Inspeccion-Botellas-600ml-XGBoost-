name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: inspeccion-botellas:v1.0

jobs:
  pruebas:
    name: Pruebas automatizadas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Construir la imagen de pruebas
        run: docker build --target test -t inspeccion-botellas:test .

      - name: Ejecutar PyTest
        run: docker run --rm inspeccion-botellas:test

  imagen:
    name: Construir y verificar la imagen
    runs-on: ubuntu-latest
    needs: pruebas
    timeout-minutes: 15
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Construir la imagen final
        run: docker build -t "$IMAGE" .

      - name: Iniciar el contenedor
        run: docker run -d -p 8000:8000 --name app "$IMAGE"

      - name: Esperar a que la API responda
        run: |
          for attempt in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1

      - name: Ejecutar la prueba de humo
        run: sh scripts/smoke_test.sh

      - name: Verificar el frontend
        run: curl -sf http://localhost:8000/ | grep -q "Inspección de Botellas 600ml"

      - name: Mostrar registros del contenedor
        if: failure()
        run: docker logs app

      - name: Exportar la imagen
        run: docker save "$IMAGE" | gzip > inspeccion-botellas-v1.0.tar.gz

      - name: Guardar la imagen como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: imagen-docker
          path: inspeccion-botellas-v1.0.tar.gz
          retention-days: 7
          compression-level: 0
